[project]
name = "investment-monitoring"
version = "0.1.0"
description = "PortfolioLab – Portfolio analysis dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "yfinance>=0.2.50",
    "requests==2.32.3",
    "pydantic==2.9.2",
    "python-multipart==0.0.12",
    "anthropic>=0.40.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "boto3>=1.43.3",
    "mangum>=0.19.0",
    "bcrypt>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-m 'not live' -p no:cacheprovider"
filterwarnings = [
    # third-party: mangum calls asyncio.get_event_loop() at import time
    "ignore:There is no current event loop:DeprecationWarning:mangum.*",
]
markers = [
    "live: hits the real external sites (Borsa Italiana, Dataroma, justETF, OpenFIGI, Yahoo). Run with: uv run pytest -m live",
]
